      const extras = {
        tr: {
          milkLabel: "Süt Seçenekleri",
          milk: "Laktosuz +20 / Badem +40 / Yulaf +40",
          syrupLabel: "Şurup +20",
          syrup: "Vanilya / Karamel / Fındık / Salt Caramel / Cookies / Tiramisu",
          espresso: "Extra Espresso Shot",
          hot: "Sıcak",
          iced: "Soguk"
        },
        en: {
          milkLabel: "Milk Options",
          milk: "Lactose-Free +20 / Almond +40 / Oat +40",
          syrupLabel: "Syrup +20",
          syrup: "Vanilla / Caramel / Hazelnut / Salt Caramel / Cookies / Tiramisu",
          espresso: "Extra Espresso Shot",
          hot: "Hot",
          iced: "Iced"
        }
      };
      const languageButtons = [...document.querySelectorAll("[data-lang-button]")];
      const nav = document.getElementById("categoryNav");
      const root = document.getElementById("menuRoot");
      let observer;

      function textLines(value) {
        if (!value) return "";
        return String(value).split("\n").map((line) => `<span>${line}</span>`).join("");
      }

      function itemHtml(item, lang) {
        const kcal = item.kcal ? `<span class="kcal">${item.kcal}</span>` : "";
        const desc = item.desc ? `<p class="item-desc">${textLines(item.desc[lang])}</p>` : "";
        return `
          <div class="item">
            <div class="item-copy"><p class="item-name">${item.name[lang]}${kcal}</p>${desc}</div>
            <div class="price">${item.price}</div>
          </div>`;
      }

      function matrixHtml(cat, lang) {
        return `
          <div class="matrix">
            <div class="matrix-head"><span></span><span>${extras[lang].hot}</span><span>${extras[lang].iced}</span></div>
            ${cat.items.map((item) => {
              const kcal = item.kcal ? `<span class="kcal">${item.kcal}</span>` : "";
              return `<div class="matrix-row"><p class="item-name">${item.name[lang]}${kcal}</p><div class="price ${item.hot ? "" : "is-empty"}">${item.hot || "."}</div><div class="price ${item.iced ? "" : "is-empty"}">${item.iced || "."}</div></div>`;
            }).join("")}
          </div>`;
      }

      function groupsHtml(cat, lang) {
        return `<div class="subgroups">${cat.groups.map((group) => `
          <div class="subgroup">
            <h3 class="subgroup-title">${group.title[lang]}</h3>
            <div class="items">${group.items.map((item) => itemHtml(item, lang)).join("")}</div>
            ${group.option ? `<div class="options-box"><p class="option-label">${group.option.label[lang]}</p><p class="option-value">${group.option.value[lang]}</p></div>` : ""}
          </div>`).join("")}</div>`;
      }

      function extrasHtml(lang) {
        return `
          <div class="options-box extras-coffee">
            <div class="options-grid">
              <div><p class="option-label">${extras[lang].milkLabel}</p><p class="option-value">${extras[lang].milk}</p></div>
              <div><p class="option-label">${extras[lang].syrupLabel}</p><p class="option-value">${extras[lang].syrup}</p></div>
            </div>
            <div class="extras-list">
              <div class="extra-row"><span>${extras[lang].espresso}</span><span>+40</span></div>
            </div>
          </div>`;
      }

      function renderMenu(lang) {
        document.documentElement.lang = lang;
        languageButtons.forEach((button) => button.classList.toggle("is-active", button.dataset.langButton === lang));
        nav.innerHTML = categories.map((cat) => `<a href="#${cat.id}">${cat.nav[lang]}</a>`).join("");
        root.innerHTML = categories.map((cat) => {
          let body = "";
          if (cat.type === "matrix") body = matrixHtml(cat, lang);
          else if (cat.type === "groups") body = groupsHtml(cat, lang);
          else body = `<div class="items">${cat.items.map((item) => itemHtml(item, lang)).join("")}</div>`;
          return `<section class="menu-section ${cat.class}" id="${cat.id}">
            <div class="art-layer">${cat.art}</div>
            <div class="content ${cat.content_class || ""}">
              <h2 class="section-title">${cat.title[lang]}</h2>
              ${body}
            </div>
            ${cat.extras ? extrasHtml(lang) : ""}
          </section>`;
        }).join("");
        setupObserver();
      }

      function setupObserver() {
        if (observer) observer.disconnect();
        const links = [...document.querySelectorAll(".category-nav a")];
        const sections = links.map((link) => document.querySelector(link.getAttribute("href"))).filter(Boolean);
        observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            links.forEach((link) => link.classList.remove("is-active"));
            const active = document.querySelector(`.category-nav a[href="#${entry.target.id}"]`);
            if (active) {
              active.classList.add("is-active");
              active.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
            }
          });
        }, { rootMargin: "-35% 0px -55% 0px", threshold: 0.01 });
        sections.forEach((section) => observer.observe(section));
      }

      languageButtons.forEach((button) => button.addEventListener("click", () => renderMenu(button.dataset.langButton)));
      renderMenu("tr");
    </script>
  </body>
